<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .orbital-icon {
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }
    .orbital-ring {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawRing 1s ease-out 0.2s forwards;
    }
    .star {
      opacity: 0;
      transform-origin: center;
      animation: starAppear 0.4s ease-out forwards, twinkle 2.5s ease-in-out infinite;
    }
    .star-1 { animation-delay: 0.5s, 1s; }
    .star-2 { animation-delay: 0.65s, 1.15s; }
    .star-3 { animation-delay: 0.8s, 1.3s; }
    .star-4 { animation-delay: 0.95s, 1.45s; }
    
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes drawRing {
      to { stroke-dashoffset: 0; opacity: 0.9; }
    }
    @keyframes starAppear {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <g class="orbital-icon" transform="translate(4, 12)">
    <!-- Orbital Ring -->
    <ellipse 
      class="orbital-ring"
      cx="20" 
      cy="12" 
      rx="18" 
      ry="7" 
      stroke="#d4a054" 
      stroke-width="1.5" 
      fill="none"
      transform="rotate(-15, 20, 12)"
    />
    
    <!-- Stars on orbital path -->
    <circle class="star star-1" cx="8" cy="6" r="2.5" fill="#f5c97a"/>
    <circle class="star star-2" cx="35" cy="10" r="1.8" fill="#f5c97a"/>
    <circle class="star star-3" cx="28" cy="20" r="2.2" fill="#f5c97a"/>
    <circle class="star star-4" cx="5" cy="16" r="2" fill="#f5c97a"/>
  </g>
</svg>
