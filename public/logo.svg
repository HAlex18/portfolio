<svg width="320" height="48" viewBox="0 0 320 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->
  
  <!-- Orbital Ring -->
  <g transform="translate(4, 12)">
    <ellipse 
      cx="20" 
      cy="12" 
      rx="18" 
      ry="7" 
      stroke="#d4a054" 
      stroke-width="1.2" 
      fill="none"
      transform="rotate(-15, 20, 12)"
    />
    
    <!-- Stars on orbital path -->
    <circle cx="8" cy="6" r="2.2" fill="#f5c97a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="10" r="1.4" fill="#f5c97a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="20" r="1.8" fill="#f5c97a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="16" r="1.6" fill="#f5c97a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text: Hiroko A Mizoguchi -->
  <!-- Using Space Grotesk style letterforms -->
  <text 
    x="52" 
    y="32" 
    font-family="Space Grotesk, system-ui, sans-serif" 
    font-size="24" 
    font-weight="500" 
    fill="#d4a054"
    letter-spacing="0.02em"
  >
    Hiroko A Mizoguchi
  </text>
</svg>
